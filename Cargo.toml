[workspace]
resolver = "2"
members = [
    "apps/island-app",
    "crates/island-core",
    "crates/island-ui",
    "crates/island-platform",
    "crates/island-services",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Labubu <labubu@local>"]
license = "GPL-3.0-or-later"

[workspace.dependencies]
island-core = { path = "crates/island-core" }
island-ui = { path = "crates/island-ui" }
island-platform = { path = "crates/island-platform" }
island-services = { path = "crates/island-services" }

slint = "1.18.1"
slint-build = "1.18.1"
tokio = { version = "1.44", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = "5.19"
wayland-client = "0.31.14"
wayland-protocols-plasma = { version = "0.3.12", features = ["client"] }
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
